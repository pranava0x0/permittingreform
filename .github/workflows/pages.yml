name: pages

# Publishes site/ to GitHub Pages. Runs only when started by hand: nothing is
# published until someone presses "Run workflow". No build step: site/data/*.js
# is committed, and ci proves it matches data/.
#
# Security posture: no github.event.* input is interpolated; the one expression
# used is a trusted step output, per the official deploy-pages pattern.
permissions:
  contents: read
  pages: write
  id-token: write

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Gate on all offline checks
        run: make check
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
