name: ci

# Security posture: no event-controlled input is interpolated anywhere
# (no github.event.*), and the token is read-only.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Offline gates
        run: make check

      - name: Generated output is committed in sync
        run: git diff --exit-code
